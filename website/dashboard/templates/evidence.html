<section id="research-evidence" aria-labelledby="evidence-heading">
  <h3 id="evidence-heading" tabindex="-1" data-i18n="research_evidence">Evidence</h3>
  <div id="evidence-files"></div>
  <section id="evidence-preview" hidden aria-labelledby="preview-name">
    <div class="preview-tools">
      <strong id="preview-name" tabindex="-1"></strong>
      <a id="evidence-open" target="_blank" rel="noopener" data-i18n="research_open">Open file</a>
      <button type="button" id="evidence-close" data-i18n="research_close">Close</button>
    </div>
    <div id="preview-content"></div>
  </section>
</section>
