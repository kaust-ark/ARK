# Install into a dedicated base-backed Idea2Paper profile.
- id: hmr
  disabled: !!js "!ctx.get('profileContext') || ctx.get('profileContext').name === 'idea2paper'"
- id: session-log-deepseek
  disabled: !!js "ctx.get('profileContext')?.name === 'idea2paper'"
- id: plugin-package-inventory-deepseek
  disabled: !!js "ctx.get('profileContext')?.name === 'idea2paper'"
- id: session-telemetry-otel
  disabled: !!js "ctx.get('profileContext')?.name === 'idea2paper'"
- id: llm-retry
  disabled: !!js "ctx.get('profileContext')?.name === 'idea2paper'"
- id: session-title-llm
  disabled: !!js "ctx.get('profileContext')?.name === 'idea2paper'"
- insert:
    - id: idea2paper
      name: idea2paper-dsh
      disabled: !!js "ctx.get('profileContext')?.name !== 'idea2paper'"
