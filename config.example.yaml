# =============================================================================
# ARK config — template
#
# Copy this to your live config (global at .ark/config.yaml, or per-project)
# and fill it in:
#     cp config.example.yaml .ark/config.yaml
#
# ARK runs every agent through OpenHands, which routes to Anthropic / OpenAI /
# Google via LiteLLM. You pick the model; the model's prefix (anthropic/ ,
# openai/ , gemini/) decides which API key is used.
# =============================================================================

# ── Which model to run ───────────────────────────────────────────────────────
# Heavy research agents (researcher / reviewer / planner / writer /
# experimenter / coder). Change this one line to switch provider.
# Overridable at run time with `--model <string>` (CLI) or the webapp dropdown.
model: anthropic/claude-sonnet-4-6
#   anthropic/claude-sonnet-4-6      (Claude — recommended default)
#   anthropic/claude-opus-4-8
#   gemini/gemini-2.5-pro            (Gemini)
#   openai/gpt-5                     (OpenAI)
#   ANY OpenHands/LiteLLM provider also works: deepseek/… , xai/… ,
#   mistral/… , groq/… , bedrock/… , ollama/… — the three above are just
#   the common ones. (exact model ids: see the LiteLLM provider docs)

# Light helpers (paper title, iteration summary, Telegram bot replies, message
# classification). These are simple one-shot LLM calls (via LiteLLM, NOT the
# agent loop) — a cheap model is plenty.
bot_model: anthropic/claude-haiku-4-5

# ── API keys ─────────────────────────────────────────────────────────────────
# Fill the key(s) for the provider(s) you use. Only the SELECTED model's key is
# strictly required — but filling all three lets you switch models freely
# without editing keys again.
anthropic_api_key: ""     # required if model / bot_model uses  anthropic/*
openai_api_key:    ""     # required if model / bot_model uses  openai/*
gemini_api_key:    ""     # required if model / bot_model uses  gemini/*
                          # ★ ALSO powers Gemini Deep Research, which is
                          #   Gemini-ONLY and runs regardless of `model`.
                          #   No gemini key  ->  Deep Research is skipped
                          #   (optional feature, not an error).
# For any other provider, add  <provider>_api_key  — e.g. deepseek_api_key,
# xai_api_key, mistral_api_key. It is bridged to <PROVIDER>_API_KEY automatically.

# ── Step log verbosity ───────────────────────────────────────────────────────
# How much of each agent's per-action stream (bash commands, file edits,
# observations) is written to the human-readable log. The structured journal
# (auto_research/state/agent_steps.jsonl) is always full-fidelity regardless.
#   quiet   — phase headers + final result only
#   normal  — one line per command / edit / message (recommended)
#   verbose — also observations + per-step detail
#   debug   — also raw events
log_verbosity: normal

# ── Intervention (pre-action guardrails) ─────────────────────────────────────
# Pause-and-ask-a-human before the high-stakes things an autonomous run can do:
# delete files, launch many jobs, hand over credentials, push/exfil data, or
# overspend. Approvals are relayed over Telegram; with no Telegram configured
# the gate FAILS OPEN (auto-allows and just logs) so nothing ever hangs.
intervention:
  enabled: true              # master switch for the gate (step log stays on)

  # How readily it asks:
  #   cautious   — ask on anything it flags (even low-severity)
  #   standard   — ask only on high-severity (rm -rf, job bursts, cloud, creds)
  #   autonomous — ask only on critical (delete .git, blow the hard budget cap)
  autonomy: standard

  # Toggle individual risk categories (all on by default).
  categories:
    destructive_fs: true     # rm -rf, deletes outside the work area
    bulk_compute:   true      # job bursts, cloud instance provisioning
    credentials:    true      # requesting / hardcoding / printing secrets
    data_exfil:     true      # scp/rsync to external hosts, HTTP uploads
    spend:          true      # cumulative cost thresholds
  # Note: agent `git` commands are intentionally NOT gated (too noisy). ARK still
  # gates its OWN autonomous push and cloud provisioning.

  # Bulk-compute burst: ask once more than N jobs are launched within the window.
  max_jobs_in_window: 8
  job_window_seconds: 600

  # Spend: notify (non-blocking) at the soft threshold, ask (blocking) at the cap.
  spend_notify_usd: 20
  spend_ask_usd: 100

# ── Artifact storage (Phase 3, ADR-0012) ─────────────────────────────────────
# Where project artifacts (the compiled PDF, figures, the export bundle) live.
# Orthogonal to the compute backends. Defaults to the local filesystem rooted at
# the project dir, so local dev and SLURM on a shared mount behave exactly as
# before. Object stores (S3/GCS/Azure — prefer the user's own bucket under BYOC)
# are served through the dashboard as a proxy today; presigned URLs come later.
artifact_store:
  type: local                # local | s3 | gcs | azure   (default: local)
  # For object stores only:
  # bucket: my-ark-bucket    # required for s3/gcs/azure
  # prefix: ark/             # optional key prefix within the bucket
  # Credentials default to the configured cloud compute backend's if unset.
