[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ark-research"
version = "0.3.0"
description = "ARK - Automatic Research Kit: AI-powered idea-to-paper automation"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "PyMuPDF>=1.24.0", "Pillow>=10.0.0", "litellm>=1.70", "exceptiongroup>=1.2; python_version < \"3.11\""]

[project.optional-dependencies]
# Deep Research uses google-genai. PaperBanana (submodules/PaperBanana) is
# imported inline by ark/latex/compiler.py — `from agents.planner_agent
# import PlannerAgent` walks straight into the submodule, so all of
# PaperBanana's runtime imports must resolve in the same Python that runs
# the orchestrator. A missing dep here = silent fallback to Nano Banana
# on every paper run (real bug we shipped: ark-prod was missing aiofiles
# the whole time, so prod papers never used the 5-agent figure pipeline).
# Skip the demo-UI deps (gradio, streamlit) — runtime doesn't import them.
research = [
    "google-genai>=2.0.0",
    "anthropic>=0.40.0",
    "aiofiles>=23.0",
    "json_repair>=0.30",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "tqdm>=4.65",
    "google-auth>=2.0",
    "huggingface_hub>=0.20",
    "openai>=1.0",
]
webapp = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlmodel>=0.0.14",
    "alembic>=1.13",           # schema migrations (sqlite dev + postgres)
    "psycopg[binary]>=3.1",    # postgres driver for deployed control planes
    "authlib>=1.3",
    "httpx>=0.25",
    "python-multipart>=0.0.6",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "itsdangerous>=2.1",
    "cryptography>=41.0",
    "markdown>=3.5",
    "weasyprint>=60.0",
]
# Object-storage artifact backends (Phase 3, ADR-0012). Only needed when
# `artifact_store.type` is s3/gcs/azure; each provider SDK is imported lazily, so
# install just the one your bucket uses. Default (`local`) needs none of these.
object = [
    "boto3>=1.28",                 # s3 (and S3-compatible: MinIO, R2, …)
    "google-cloud-storage>=2.10",  # gcs
    "azure-storage-blob>=12.14",   # azure
    "azure-identity>=1.14",        # azure — DefaultAzureCredential when no conn string
]
# SkyPilot provisioning (folded Phases 5+6, ADR-0010). Only needed when a compute
# backend uses `type: skypilot`; the SDK is imported lazily (ark/compute/_sky.py),
# so nothing here is required unless a skypilot backend is actually launched.
# Install the cloud extras you use, e.g. `pip install 'skypilot[gcp,aws,kubernetes]'`.
skypilot = [
    # >= 0.10 for SkyPilot "workspaces" (per-user GCP project isolation via one
    # central cross-project service account); the launcher selects the active
    # workspace per launch (ark/compute/_sky.py::active_workspace).
    "skypilot>=0.10",
]


[project.scripts]
ark = "ark.cli:main"

[tool.pytest.ini_options]
markers = [
    "network: tests that hit real APIs (deselect with '-m not network')",
    "gcp: tests that provision real Google Cloud resources (deselect with '-m not gcp')",
    "skypilot: tests that provision real resources via SkyPilot (deselect with '-m not skypilot')",
    "unit: fast offline/logic tests",
    "integration: slow tests requiring external services or full pipeline mocks",
]

[tool.setuptools.packages.find]
include = ["ark*", "website*"]

[tool.setuptools.package-data]
ark = ["templates/**/*"]
website = ["dashboard/static/**/*", "dashboard/templates/**/*", "dashboard/slurm_template.sh"]

[tool.ark]
# Team deployment (shared prod). Used by `ark activate prod` and as the
# fallback for ARK_RELEASE_ROOT / ARK_CONDA_ROOT / ARK_TOOLS_BIN when those
# env vars are unset. Ignored automatically when the paths don't exist on
# this machine (e.g. external self-hosters).
release_root = "/data/fat/ark/ARK"
conda_root   = "/data/fat/ark/conda"
tools_bin    = "/data/fat/ark/tools/bin"
