name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[research,webapp]"
          pip install pytest

      - name: Install TeX Live for manuscript and venue compilation tests
        if: matrix.python-version == '3.11'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            lmodern cm-super tex-gyre texlive-latex-extra texlive-science texlive-publishers \
            texlive-bibtex-extra texlive-fonts-recommended texlive-fonts-extra
          pdflatex --version
          bibtex --version

      - name: Run tests
        run: python -m pytest tests/ -q -m "not network and not gcp and not skypilot"
