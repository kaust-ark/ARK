# Alembic config for the ARK control-plane database (Phase 2).
#
# The connection URL is intentionally left blank here: the app sets it
# programmatically (website/dashboard/db.py::_alembic_config), and the CLI
# resolves it via env.py -> resolve_db_url() from ARK_DATABASE_URL / DB_PATH.
# To target a specific database from the CLI without touching env vars:
#     alembic -x db_url=postgresql+psycopg://user:pass@host/db upgrade head
# (or export ARK_DATABASE_URL=... and just run `alembic upgrade head`).

[alembic]
script_location = website/dashboard/migrations
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
